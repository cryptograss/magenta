{# The open merge asks (🪢) naming a piece of work (services/ramp.asks): a dot of each asking emergent's colour, each a link to its ask (Justin, 9 Nov). w: the work. #}
{% if w.asks %}<span class="asks" title="{% for a in w.asks %}{{ a.by }}{% if not forloop.last %}, {% endif %}{% endfor %} asked for this merge">{% for a in w.asks %}<a class="askdot" href="/moods/{{ a.mood }}/#m-{{ a.id }}" style="--who: {{ a.colour }}" title="{{ a.by }} asked for this merge in #{{ a.mood }}" aria-label="{{ a.by }} asked for this merge in #{{ a.mood }}"></a>{% endfor %} asked</span>{% endif %}
