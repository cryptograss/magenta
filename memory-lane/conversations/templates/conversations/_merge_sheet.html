<!-- The merge button's sheet (services/merge_orders.py; Cryptograss:Moods/ramp/Plan, section 10): what merging
     a piece of work brings, from githouse's copy, who asked for it and who 👍'd it, then "Merge now". The press is
     signed by memory-lane's own key, for whoever pressed, and githouse checks everything again. Opened by
     magentaMerge.open({repo, branch} or {repo, number}, mood): the ramp's Merge buttons, a 🪢 ask's, /merge in
     the composer. Each button's preview is fetched before it's pressed (prefetch), so the sheet opens with it.

     One sheet a Mood. On the one page it covers only that Mood's pane, and goes and comes with it: press Merge,
     go to another Mood, come back to see how it went (Justin, 9 Nov). magentaMerge.within(() => element) says
     what pane it covers; magentaMerge.show(slug) which Mood is on screen (null: none). Without them, the sheet
     covers the page, as on the ramp and a work's page. -->
{% include "conversations/_ticker.html" %}
<template id="mergeSheetTpl">
  <div class="mergeSheet" hidden role="dialog">
    <div class="box">
      <div class="head"><span class="what"></span><span class="sub"></span></div>
      <div class="about" hidden><b class="title"></b><span class="words"></span></div>
      <div class="who"></div>
      <pre class="stat" hidden></pre>
      <a class="full" href="#" hidden title="The candidate's page: its commits, every file's diff, what's been said about it">More details →</a>
      <div class="say"></div>
      <div class="row"><button type="button" class="no">Close</button><button type="button" class="go" hidden>Merge now</button></div>
    </div>
  </div>
</template>
<script>
window.magentaMerge = (() => {
  const tpl = document.getElementById('mergeSheetTpl');
  const csrf = () => (document.cookie.match(/(?:^|; )csrftoken=([^;]*)/) || [])[1] || '';
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const sheets = new Map();   // mood ('' off the one page) -> its sheet
  let pane = null;            // () => the element a sheet covers; null: the whole page
  let onScreen = undefined;   // the Mood shown now; undefined: not told (every sheet shows as opened)

  // Over the pane, not the page: the Moods list, the header and the other Moods stay to hand.
  function place(s) {
    const el = pane && pane();
    s.el.setAttribute('aria-modal', el ? 'false' : 'true');
    if (!el) { s.el.style.inset = '0'; return; }
    const r = el.getBoundingClientRect();
    Object.assign(s.el.style, { inset: 'auto', left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px' });
  }
  const placeAll = () => sheets.forEach(s => { if (!s.el.hidden) place(s); });
  window.addEventListener('resize', placeAll);

  function sheetFor(mood) {
    if (sheets.has(mood)) return sheets.get(mood);
    const el = tpl.content.firstElementChild.cloneNode(true);
    document.body.appendChild(el);
    // gen: which open() is current. A preview that answers after another was opened is dropped, so the sheet
    // never names one piece of work while holding another's commit for the press (re, 8 Nov).
    const s = { el, mood, seen: null, gen: 0, alive: false, $: q => el.querySelector(q) };
    s.say = (text, kind) => { const t = s.$('.say'); t.textContent = text; t.className = 'say' + (kind ? ' ' + kind : ''); };
    s.shut = () => { el.hidden = true; s.alive = false; s.gen++; s.seen = null; };
    s.$('.no').addEventListener('click', s.shut);
    el.addEventListener('click', e => { if (e.target === el) s.shut(); });
    s.$('.go').addEventListener('click', () => press(s));
    // ± See the full diff: the candidate's page, in the ramp, at #diff (made there if it has none). In the one
    // page (a Mood's sheet) its click handler opens it in the ramp, and Back comes here; in a frame (the ramp,
    // a candidate's page), the one page is asked to. Already on that very page: its diffs open under the sheet.
    s.$('.full').addEventListener('click', e => {
      if (e.button || e.metaKey || e.ctrlKey || e.shiftKey) return;  // a new tab: its own address
      const to = new URL(e.currentTarget.href, location.href);
      s.shut();
      if (to.pathname === location.pathname) {
        e.preventDefault();
        window.dispatchEvent(new Event('magentaShowDiff'));
      } else if (window.parent !== window) {
        e.preventDefault();
        parent.postMessage({ magentaGo: to.pathname + to.hash }, location.origin);
      }
    });
    sheets.set(mood, s);
    return s;
  }
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    sheets.forEach(s => { if (!s.el.hidden) s.shut(); });
  });

  // Who wants it (Justin, 9 Nov): a dot for each emergent asking for this merge, and each person's 👍.
  function drawWho(s, body) {
    const asks = (body.asks || []).map(a => `<a href="/moods/${encodeURIComponent(a.mood)}/#m-${esc(a.id)}"`
      + ` title="${esc(a.by)} asked for this merge in #${esc(a.mood)}"><span class="dot" style="--who: ${esc(a.colour)}"></span>${esc(a.by)}</a>`);
    const thumbs = (body.thumbs || []).map(t => t.current ? `<span title="on this commit">${esc(t.by)}</span>`
      : `<span class="stale" title="on an older commit: the branch has moved since">${esc(t.by)} (older commit)</span>`);
    s.$('.who').innerHTML = (asks.length ? `<span>🪢 asked: ${asks.join(', ')}</span>` : '')
      + (thumbs.length ? `<span>👍 ${thumbs.join(', ')}</span>` : '');
  }

  // Fetched before the press (Justin, 9 Nov: "Can we prefetch everything needed for this to be instant?"): a
  // Merge button drawn, hovered or touched asks for its preview, kept KEPT_MS; the sheet opens on it at once and
  // asks again behind it, redrawn if githouse moved meanwhile. The press is checked against githouse's copy
  // anyway (a moved branch is refused: "moved since you looked").
  const KEPT_MS = 45000;
  const kept = new Map();   // 'repo#n' or 'repo:branch' -> {at, got: Promise<{ok, status, body}>}
  const nameOf = work => work.number ? `${work.repo}#${work.number}` : `${work.repo}:${work.branch}`;
  // A promotion (Justin, 11 Nov): production into main, the one deploy branch merged into another (githouse.PROMOTES).
  const isPromotion = work => !work.number && work.branch === 'production';
  function ask(work) {
    const q = new URLSearchParams({ repo: work.repo, branch: work.branch || '' });
    if (work.number) q.set('number', work.number);
    return fetch('/api/merge-orders/preview/?' + q, { credentials: 'same-origin' })
      .then(async r => ({ ok: r.ok, status: r.status, body: await r.json() }));
  }
  function prefetch(work) {
    if (!work || !work.repo) return null;
    const name = nameOf(work), had = kept.get(name);
    if (had && Date.now() - had.at < KEPT_MS) return had.got;
    const got = ask(work).catch(e => ({ ok: false, error: e }));
    kept.set(name, { at: Date.now(), got });
    got.then(g => { if (!g.ok) kept.delete(name); });  // a refusal or a lost line isn't kept
    return got;
  }

  function draw(s, r) {
    if (r.error) { s.say('Couldn’t reach memory-lane: ' + r.error.message, 'err'); return; }
    if (!r.ok) { s.say(r.body.error || ('memory-lane said ' + r.status), 'err'); return; }
    const body = r.body;
    s.seen = body;
    s.$('.sub').textContent = `${body.repo}:${body.branch} at ${body.commit.slice(0, 12)} → ${body.into} at ${body.tip.slice(0, 12)}`;
    drawWho(s, body);
    // What it is, before what it changes (Justin, 10 Nov): its title and the start of its description. Its commits
    // are on its page.
    s.$('.about .title').textContent = body.title || '';
    s.$('.about .words').textContent = body.about || '';
    s.$('.about').hidden = !(body.title || body.about);
    s.$('.stat').textContent = body.stat.trim(); s.$('.stat').hidden = false;
    // The whole diff, on the candidate's page (Justin, 9 Nov: "a link from the merge modal to see the full diff").
    const full = s.$('.full');
    if (body.branch) full.href = `/ramp/${encodeURIComponent(body.repo)}/${body.branch.split('/').map(encodeURIComponent).join('/')}/#diff`;
    full.hidden = !body.branch || !!body.promote;  // production has no candidate's page
    if (body.can && body.promote) {
      s.$('.go').hidden = false;
      s.say(`Signed by memory-lane on your press; githouse checks it again and promotes, never forcing: main ends at exactly this production.`);
    } else if (body.conflicts && body.conflicts.length) {
      // githouse would refuse it: no button, and why, with the files (Justin, 13 Nov).
      s.$('.go').hidden = true;
      s.say(`Conflicts with ${body.into} in ${body.conflicts.join(', ')}. Its author merges ${body.into} into it and pushes; then it can merge.`, 'err');
    } else if (body.can) {
      s.$('.go').hidden = false;
      s.say(`Signed by memory-lane on your press; githouse checks it again and merges --no-ff, exactly this commit.`);
    } else {
      s.$('.go').hidden = true;
      s.say(`Only ${(body.mergers || []).join(' and ') || 'the mergers'} can merge from here, signed in with their SSH key.`);
    }
  }

  // What's been pressed here: on its way to githouse, or merged (shared with window.magentaTicker).
  const going = new Set();
  const namesOf = w => [w.number ? `${w.repo}#${w.number}` : '', w.branch ? `${w.repo}:${w.branch}` : ''].filter(Boolean);
  const { barLine, barUnder, feed, noteMerged, isMerged, named, placeBar } = window.magentaTicker;

  // One sheet a Mood, free again the moment Merge now is pressed: the press goes on in the bar, so another pill
  // opens its own work, not the one still merging (Justin, 12 Nov).
  async function open(work, inMood) {
    const s = sheetFor(inMood || '');
    const mine = ++s.gen;
    s.seen = null; s.alive = true;
    s.$('.what').textContent = isPromotion(work) ? `Promote ${work.repo}: main up to production?` : `Merge ${nameOf(work)}?`;
    s.$('.sub').textContent = '';
    s.$('.who').innerHTML = '';
    s.$('.about').hidden = s.$('.stat').hidden = s.$('.full').hidden = true;
    s.$('.go').hidden = true; s.$('.go').disabled = false;
    // Pressed already: nothing to press twice. githouse would only refuse it ("in main already").
    if (namesOf(work).some(n => going.has(n))) { s.say('Already on its way to githouse: the bar at the top says how it’s going.'); reveal(s); return; }
    if (isMerged(work)) { s.say('Merged just now, from here.', 'ok'); reveal(s); return; }
    s.say('Looking at it in githouse’s copy…');
    reveal(s);
    const had = kept.get(nameOf(work));
    if (had) {  // drawn from what was fetched before the press, then asked again behind it
      const first = await had.got;
      if (mine !== s.gen || !s.alive) return;
      if (first.ok) draw(s, first);
      if (first.ok && Date.now() - had.at < 3000) return;  // asked just now: asking again says the same
      kept.delete(nameOf(work));
    }
    const now = await prefetch(work);
    if (mine !== s.gen || !s.alive) return;
    if (!s.seen || !now.ok || now.body.commit !== s.seen.commit || now.body.tip !== s.seen.tip
        || JSON.stringify([now.body.asks, now.body.thumbs]) !== JSON.stringify([s.seen.asks, s.seen.thumbs])) draw(s, now);
  }

  // Shown if its Mood is on screen (or nobody said which is); kept, out of sight, while another is.
  function reveal(s) {
    if (!s.alive) return;
    s.el.hidden = onScreen !== undefined && onScreen !== s.mood;
    if (!s.el.hidden) place(s);
  }

  // The one page's bar, if this is a section's frame inside it; else this page's own (_ticker.html).
  function topBar() {
    try {
      const up = window.parent;
      if (up !== window && up.location.origin === location.origin && up.magentaMerge && up.magentaMerge.barLine) return up.magentaMerge;
    } catch (e) {}
    return null;
  }

  // Merge now: the sheet goes at once, and the bar says how it's going (Justin, 9 Nov). Clicking the bar's
  // line shows githouse's whole answer. Another press meanwhile is its own line: githouse takes orders one at a
  // time, each onto the branch as the last left it, and refuses one that conflicts, saying so (12 Nov).
  async function press(s) {
    const seen = s.seen;
    if (!seen) return;
    const mood = s.mood, sub = s.$('.sub').textContent;
    s.shut();  // free for the next pill now, not when githouse answers
    const names = namesOf(seen);
    names.forEach(n => going.add(n));
    const name = seen.promote ? `${seen.repo}: main up to production` : `${seen.repo}:${seen.branch}`;
    const doing = seen.promote ? 'Promoting' : 'Merging';
    const line = (topBar() || { barLine }).barLine({ what: seen.promote ? `Promote ${name}?` : `Merge ${name}?`, sub });
    line.say(seen.promote ? `Promoting ${name}…` : `Merging ${name} into ${seen.into}…`);
    let ok = false, words = '';
    try {
      const r = await fetch('/api/merge-orders/press/', {
        method: 'POST', credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrf() },
        body: JSON.stringify({ repo: seen.repo, branch: seen.branch, number: seen.number, commit: seen.commit,
                               into: seen.into, mood }) });
      let status = await r.json();
      if (!r.ok) {
        words = status.error || ('memory-lane said ' + r.status);
      } else {
        if (status.id && line.claim) line.claim('merge:' + status.id);  // shared feed owns the same chip
        for (let waited = 0; status.status === 'waiting' && waited < 120; waited += 3) {
          line.say(`${doing} ${name}${seen.promote ? '' : ' into ' + seen.into}… ${waited ? waited + ' s' : ''}`);
          await new Promise(go => setTimeout(go, 3000));
          status = await (await fetch(`/api/merge-orders/${status.id}/`, { credentials: 'same-origin' })).json();
        }
        if (status.status === 'merged') {
          ok = true;
          words = seen.promote ? `main is production now, at ${String(status.merge || '').slice(0, 12)}.`
            : `Merged into ${seen.into} as ${String(status.merge || '').slice(0, 12)}.`;
        } else if (status.status === 'waiting') words = 'githouse hasn’t answered in two minutes; the order is good for an hour.';
        else words = `${status.status === 'expired' ? 'Expired' : 'Refused'}: ${status.why || ''}`;
      }
    } catch (e) {
      words = 'Lost touch with memory-lane: ' + e.message;
    } finally {
      names.forEach(n => going.delete(n));
    }
    if (ok) {
      line.end('ok', seen.promote ? `${seen.repo}: main promoted to production` : `${name} merged into ${seen.into}`, words);
      // Told here and to the one page, so the ramp and the Mood's pills drop it without a reload.
      const merged = { repo: seen.repo, branch: seen.branch, number: seen.number || null };
      noteMerged(merged);
      window.dispatchEvent(new CustomEvent('magentaMerged', { detail: merged }));
      if (window.parent !== window) parent.postMessage({ magentaMerged: merged }, location.origin);
    } else {
      line.end('err', `${name}: ${words.length > 90 ? words.slice(0, 90) + '…' : words} Click for the whole of it.`, words);
    }
  }

  // The one page: the pane a sheet covers, and which Mood is on screen now (null: none, as in a section).
  function within(fn) {
    pane = fn; placeAll(); placeBar();
    if (window.ResizeObserver && fn && fn()) new ResizeObserver(() => { placeAll(); placeBar(); }).observe(fn());
  }
  function show(slug) { onScreen = slug; sheets.forEach(reveal); }

  return { open, named, within, show, prefetch, barLine, barUnder, feed, noteMerged, isMerged };
})();
</script>
