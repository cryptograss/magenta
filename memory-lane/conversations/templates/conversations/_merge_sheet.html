<!-- The merge button's sheet (services/merge_orders.py; Cryptograss:Moods/ramp/Plan, section 10): what merging
     a piece of work brings, from githouse's copy, then "Merge now". The press is signed by memory-lane's own key,
     for whoever pressed, and githouse checks everything again. Opened by magentaMerge.open({repo, branch} or
     {repo, number}, mood): the ramp's Merge buttons, a 🪢 ask's, and /merge in the composer. -->
<style>
  #mergeSheet { position: fixed; inset: 0; z-index: 1000; display: flex; align-items: center; justify-content: center;
                background: rgba(0,0,0,.45); padding: 12px; }
  #mergeSheet[hidden] { display: none; }
  #mergeSheet .box { background: var(--panel, #fff); color: var(--ink, #1f1d1a); border: 1px solid var(--line, #e6e1d8);
                     border-radius: 10px; width: min(720px, 100%); max-height: 92vh; display: flex; flex-direction: column;
                     box-shadow: 0 10px 40px rgba(0,0,0,.3); }
  #mergeSheet .head { padding: 12px 14px 6px; font-weight: 600; }
  #mergeSheet .head .sub { display: block; font-weight: 400; font-size: 12.5px; color: var(--muted, #6b6560);
                           font-family: ui-monospace, SFMono-Regular, Menlo, monospace; margin-top: 2px; }
  #mergeSheet pre { margin: 0 14px 8px; padding: 8px 10px; background: var(--code, #f3efe8); border-radius: 6px;
                    font-size: 12px; overflow: auto; white-space: pre; max-height: 30vh; }
  #mergeSheet .say { padding: 0 14px 8px; font-size: 13px; }
  #mergeSheet .say.err { color: var(--err, #c0392b); }
  #mergeSheet .say.ok { color: var(--ok, #2e9e5b); }
  #mergeSheet .row { display: flex; gap: 8px; justify-content: flex-end; padding: 8px 14px 12px; }
  #mergeSheet button { font: inherit; border-radius: 6px; padding: 6px 14px; cursor: pointer;
                       border: 1px solid var(--line, #e6e1d8); background: none; color: inherit; }
  #mergeSheet button.go { background: var(--accent, #b8106b); border-color: var(--accent, #b8106b); color: #fff; font-weight: 600; }
  #mergeSheet button:disabled { opacity: .5; cursor: default; }
</style>
<div id="mergeSheet" hidden role="dialog" aria-modal="true" aria-labelledby="mergeSheetTitle">
  <div class="box">
    <div class="head" id="mergeSheetTitle"><span class="what"></span><span class="sub"></span></div>
    <pre class="log" hidden></pre>
    <pre class="stat" hidden></pre>
    <div class="say"></div>
    <div class="row"><button type="button" class="no">Close</button><button type="button" class="go" hidden>Merge now</button></div>
  </div>
</div>
<script>
window.magentaMerge = (() => {
  const sheet = document.getElementById('mergeSheet');
  const $ = s => sheet.querySelector(s);
  let seen = null, mood = '', busy = false;
  const csrf = () => (document.cookie.match(/(?:^|; )csrftoken=([^;]*)/) || [])[1] || '';
  const say = (text, kind) => { const el = $('.say'); el.textContent = text; el.className = 'say' + (kind ? ' ' + kind : ''); };
  const shut = () => { if (!busy) sheet.hidden = true; };
  $('.no').addEventListener('click', shut);
  sheet.addEventListener('click', e => { if (e.target === sheet) shut(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !sheet.hidden) shut(); });

  async function open(work, inMood) {
    seen = null; mood = inMood || ''; busy = false;
    const name = work.number ? `${work.repo}#${work.number}` : `${work.repo}:${work.branch}`;
    $('.what').textContent = `Merge ${name}?`;
    $('.sub').textContent = '';
    $('.log').hidden = $('.stat').hidden = true;
    $('.go').hidden = true; $('.go').disabled = false;
    say('Looking at it in githouse’s copy…');
    sheet.hidden = false;
    const q = new URLSearchParams({ repo: work.repo, branch: work.branch || '' });
    if (work.number) q.set('number', work.number);
    let r, body;
    try {
      r = await fetch('/api/merge-orders/preview/?' + q, { credentials: 'same-origin' });
      body = await r.json();
    } catch (e) { say('Couldn’t reach memory-lane: ' + e.message, 'err'); return; }
    if (!r.ok) { say(body.error || ('memory-lane said ' + r.status), 'err'); return; }
    seen = body;
    $('.sub').textContent = `${body.repo}:${body.branch} at ${body.commit.slice(0, 12)} → ${body.into} at ${body.tip.slice(0, 12)}`;
    $('.log').textContent = body.log.trim(); $('.log').hidden = false;
    $('.stat').textContent = body.stat.trim(); $('.stat').hidden = false;
    if (body.can) {
      $('.go').hidden = false;
      say(`Signed by memory-lane on your press; githouse checks it again and merges --no-ff, exactly this commit.`);
    } else {
      say(`Only ${(body.mergers || []).join(' and ') || 'the mergers'} can merge from here, signed in with their SSH key.`);
    }
  }

  $('.go').addEventListener('click', async () => {
    if (!seen || busy) return;
    busy = true; $('.go').disabled = true; $('.no').disabled = true;
    say('Sending to githouse…');
    try {
      const r = await fetch('/api/merge-orders/press/', {
        method: 'POST', credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrf() },
        body: JSON.stringify({ repo: seen.repo, branch: seen.branch, number: seen.number, commit: seen.commit,
                               into: seen.into, mood }) });
      let status = await r.json();
      if (!r.ok) { say(status.error || ('memory-lane said ' + r.status), 'err'); return; }
      for (let waited = 0; status.status === 'waiting' && waited < 120; waited += 3) {
        say(`Waiting for githouse… ${waited ? waited + ' s' : ''}`);
        await new Promise(go => setTimeout(go, 3000));
        status = await (await fetch(`/api/merge-orders/${status.id}/`, { credentials: 'same-origin' })).json();
      }
      if (status.status === 'merged') say(`Merged into ${seen.into} as ${String(status.merge || '').slice(0, 12)}.`, 'ok');
      else if (status.status === 'waiting') say('githouse hasn’t answered in two minutes; the order is good for an hour.', 'err');
      else say(`${status.status === 'expired' ? 'Expired' : 'Refused'}: ${status.why || ''}`, 'err');
    } catch (e) {
      say('Lost touch with memory-lane: ' + e.message, 'err');
    } finally {
      busy = false; $('.no').disabled = false;
    }
  });

  // The pieces of work a 🪢 ask names: repo#N (a bare #N takes the repo before it) and repo:branch.
  function named(text) {
    const found = [], key = new Set();
    let last = '';
    for (const m of String(text || '').matchAll(/\b([a-z][a-z0-9-]*)?#(\d+)\b|\b([a-z][a-z0-9-]*):([A-Za-z0-9._-]+(?:\/[A-Za-z0-9._-]+)+)/g)) {
      const w = m[2] ? { repo: m[1] || last, number: Number(m[2]) } : { repo: m[3], branch: m[4] };
      last = w.repo || last;
      const k = w.repo + (w.number ? '#' + w.number : ':' + w.branch);
      if (w.repo && !key.has(k)) { key.add(k); found.push(w); }
    }
    return found;
  }
  return { open, named };
})();
</script>
